name: Build NX2Apple IPA

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-ipa:
    runs-on: macos-26  # Uses macOS 26 runner with Xcode 26 / iOS 26 SDK support
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Set up Homebrew & Build Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

      - name: Set up Python Virtual Environment & Dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown lz4 capstone fonttools nsz
          python3 -m pip install "backports.zstd; python_version < '3.14'"

      - name: Create Workspace Directories
        run: |
          mkdir -p workspace keys

      - name: Download Files from Google Drive Secrets
        env:
          KEYS_URL: ${{ secrets.KEYS_URL }}
          GAME_URL: ${{ secrets.GAME_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
        run: |
          source venv/bin/activate
          python3 - << 'EOF'
          import os
          import gdown

          keys_url = os.environ.get("KEYS_URL")
          game_url = os.environ.get("GAME_URL")
          update_url = os.environ.get("UPDATE_URL")

          if keys_url:
              print("Downloading prod.keys...")
              gdown.download(keys_url, "keys/prod.keys")

          if game_url:
              print("Downloading base game NSP/XCI...")
              gdown.download(game_url, "workspace/base.nsp")

          if update_url:
              print("Downloading game update NSP...")
              gdown.download(update_url, "workspace/update.nsp")
          EOF

      - name: Run NX2Apple Build Script
        run: |
          source venv/bin/activate
          python3 scripts/build_ipa_from_nsp.py workspace -k keys/prod.keys

      - name: Pack RomFS Shards
        run: |
          source venv/bin/activate
          python3 - << 'EOF'
          import os
          import glob
          import subprocess

          print("Searching workspace for extraction targets...")
          build_dirs = glob.glob("workspace/*_build")
          print(f"Found build directories: {build_dirs}")

          romfs_src = None
          for bdir in build_dirs:
              for root, dirs, files in os.walk(bdir):
                  if "romfs" in dirs:
                      candidate = os.path.join(root, "romfs")
                      # Make sure it's not our output directory
                      if "workspace/romfs" not in candidate:
                          romfs_src = candidate
                          break
              if romfs_src:
                  break

          # Fallback to the extract version directory if an explicit romfs subfolder wasn't found
          if not romfs_src:
              extracts = glob.glob("workspace/*_build/extract/*")
              if extracts:
                  romfs_src = extracts[0]

          print(f"Selected RomFS source path: {romfs_src}")

          if romfs_src and os.path.exists(romfs_src):
              os.makedirs("workspace/romfs", exist_ok=True)
              subprocess.run([
                  "python3", "dm/tools/romfs_arc.py", "pack", 
                  romfs_src, "--shard-mib", "200", "-o", "workspace/romfs"
              ], check=True)
              print("RomFS packed successfully!")
          else:
              raise FileNotFoundError("Could not find a valid source directory to pack into RomFS shards.")
          EOF

      - name: Upload Complete Build & RomFS Assets
        uses: actions/upload-artifact@v4
        with:
          name: patricks-parabox-complete-package
          path: workspace/
          retention-days: 3
