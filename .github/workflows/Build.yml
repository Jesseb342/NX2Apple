name: Build NX2Apple IPA

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-ipa:
    runs-on: macos-15  # (You can use macos-13 or macos-15 if preferred)
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Homebrew & Build Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

      - name: Set up Python Virtual Environment & Dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown lz4 capstone fonttools nsz
          python3 -m pip install "backports.zstd; python_version < '3.14'"

      - name: Create Workspace Directories
        run: |
          mkdir -p workspace keys

      - name: Download Files from Google Drive Secrets
        run: |
          source venv/bin/activate
          
          # Download prod.keys
          if [ -n "${{ secrets.KEYS_URL }}" ]; then
            python3 -m gdown "${{ secrets.KEYS_URL }}" -O keys/prod.keys --fuzzy
          fi

          # Download Base Game NSP/XCI
          if [ -n "${{ secrets.GAME_URL }}" ]; then
            python3 -m gdown "${{ secrets.GAME_URL }}" -O workspace/base.nsp --fuzzy
          fi

          # Download Game Update NSP
          if [ -n "${{ secrets.UPDATE_URL }}" ]; then
            python3 -m gdown "${{ secrets.UPDATE_URL }}" -O workspace/update.nsp --fuzzy
          fi

      - name: Run NX2Apple Build Script
        run: |
          source venv/bin/activate
          python3 scripts/build_ipa_from_nsp.py workspace -k keys/prod.keys

      - name: Upload Built IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-ipa
          path: workspace/*.ipa
          retention-days: 3
